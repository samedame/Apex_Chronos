name: tests

# Unit tests plus the full verification against the backtest (verification/fixtures.tar.gz is a trimmed copy of the data,
# so this runs offline). A failing check means the bot no longer reproduces the strategy as it was backtested.
on:
  push:
    paths-ignore:
      - "state/**"
      - "ledger/**"
  pull_request:
  workflow_dispatch:
    inputs:
      historical_probe:
        description: "Check historical Tradier data availability without orders or alerts"
        type: boolean
        default: false
      probe_quotes:
        description: "Run a read-only encrypted Tradier quote connection probe"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  historical-data:
    if: github.event_name == 'workflow_dispatch' && inputs.historical_probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-quotes.txt
      - name: Check historical market data without alerts or orders
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          CHRONOS_QUOTE_ARCHIVE_KEY: ${{ secrets.CHRONOS_QUOTE_ARCHIVE_KEY }}
        run: python -m verification.historical_availability_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-data-availability
          path: |
            historical-availability-summary.json
            historical-probe-private/
  quote-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_quotes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quotes.txt
      - run: pip install -r requirements-quotes.txt
      - name: Read option quotes without orders or alerts
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          CHRONOS_QUOTE_ARCHIVE_KEY: ${{ secrets.CHRONOS_QUOTE_ARCHIVE_KEY }}
        run: python -m verification.quote_provider_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-quote-connection-probe
          path: |
            state/quote_probe_archive/
            quote-probe-summary.json
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Verification against the backtest
        run: python -m verification.verify_against_backtest --data-dir verification/fixtures.tar.gz --fuzz-seeds 4 --workers 2

      - name: Cash-only catalog and settlement replay
        run: python -m verification.verify_cash_shadow --data-dir verification/fixtures.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: verification/VERIFICATION_REPORT.md
