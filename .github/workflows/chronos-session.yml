name: chronos-session

# The live loop: polls Yahoo every minute from ~09:31 to the close and posts ENTRY / TP1 / EXIT alerts to Discord.
#
# One trigger: the Cloudflare `open-scheduler` Worker dispatches this workflow at ~09:20 ET (see docs/SETUP.md).
# The two GitHub cron lines that used to sit behind it were removed on 2026-11-13: on this account GitHub starts
# scheduled runs about 7 hours late, so every one of them landed after the close and did nothing. If the Worker
# fails, its own "did not start" alert fires, and the evening reconcile still records the day in the ledger.
# To restore a backup: add `schedule: [{cron: "28 14 * * 1-5"}]` under `on:`.
on:
  workflow_dispatch:
    inputs:
      scheduled_for_et:
        description: "Set by open-scheduler (ignored by the bot)"
        required: false
        default: ""
      trigger:
        description: "manual | cf-scheduler | handoff"
        required: false
        default: "manual"

# One live loop at a time. A run queued behind it (hand-off or backup) waits, it never cancels the active one.
concurrency:
  group: chronos-session
  cancel-in-progress: false

permissions:
  contents: write   # commit state/ (sent-alert ledger, session history)
  actions: write    # hand-off: dispatch the next run when the 6h job limit is near

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run the live loop
        id: live
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_CAPITAL: ${{ vars.ACCOUNT_CAPITAL || '1500' }}   # default 1500; a repo variable overrides it
          SLOT_FRACTION: ${{ vars.SLOT_FRACTION }}
          # Phases whose alerts are NOT posted (still evaluated and logged). Default P1,P3 since 2026-11-13;
          # set the repo variable MUTED_PHASES to "none" to hear everything again. See docs/P2_DECISION.md.
          MUTED_PHASES: ${{ vars.MUTED_PHASES || 'P1,P3' }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          APEX_GIT_PUSH: "1"
          PYTHONUNBUFFERED: "1"
        run: python -m apex_chronos live --max-runtime-min 330

      # The session outlives one 6-hour job when it starts early; the next run catches up from minute 0.
      - name: Hand off to a fresh run
        if: steps.live.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run chronos-session.yml --ref "${{ github.ref_name }}" -f trigger=handoff
