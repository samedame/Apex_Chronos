name: cash-option-catalog

# Independent public-directory collection. No Discord credentials or live loop.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 12 * * 1-5"
    - cron: "5 13 * * 1-5"

concurrency:
  group: cash-option-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Archive active public option series
        env:
          APEX_GIT_PUSH: "1"
        run: python -m apex_chronos.cash_catalog --state-dir state
