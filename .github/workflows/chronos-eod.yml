name: chronos-eod

# After the close: re-runs the day on the FINAL one-minute bars, reconciles it against what the live loop alerted,
# appends the day's model trades to ledger/trades.csv, saves the session's volume/noise profile for tomorrow's
# baselines, and posts a forward-test summary next to the backtest numbers.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session date YYYY-MM-DD (default: today ET)"
        required: false
        default: ""
      scheduled_for_et:
        description: "Set by open-scheduler (ignored by the bot)"
        required: false
        default: ""
      trigger:
        description: "manual | cf-scheduler"
        required: false
        default: "manual"
  # One backup behind the Worker's 16:25 ET dispatch. It is always after the close (16:25 EST / 17:25 EDT, and GitHub
  # starts it hours late), and it does nothing when the day was already reconciled and posted. The second line
  # ("25 20", 15:25 EST: before the close in winter) was removed on 2026-11-13; both used to re-post the summary.
  schedule:
    - cron: "25 21 * * 1-5"

concurrency:
  group: chronos-eod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Reconcile the day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_CAPITAL: ${{ vars.ACCOUNT_CAPITAL || '1500' }}   # default 1500; a repo variable overrides it
          SLOT_FRACTION: ${{ vars.SLOT_FRACTION }}
          MUTED_PHASES: ${{ vars.MUTED_PHASES || 'P1,P3' }}   # only labels the by-phase line; every phase is still logged
          DRY_RUN: ${{ vars.DRY_RUN }}
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          CHRONOS_TRADIER_BARS: ${{ vars.CHRONOS_TRADIER_BARS }}
          APEX_GIT_PUSH: "1"
          INPUT_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m apex_chronos eod --date "$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python -m apex_chronos eod --skip-if-done
          else
            python -m apex_chronos eod
          fi
